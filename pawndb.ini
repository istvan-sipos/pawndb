# pawndb.ini — configuration for the DDDA pawn db.
# Lives beside pawndb.dll.  Lines starting with ; or # are comments.

# Root of the per-level pawn archive, relative to the DLL's folder.
# Every inn rest drops a <HEX>.{pawn,meta,json,xml} file into
# <save_dir>/<NNN>/ where <NNN> is the pawn's current level at archive
# time, left-padded with '0'. The rift shows up to max_search_results
# most-recent entries from <save_dir>/<NNN>/ whenever the game asks
# for the level-N search board.
save_dir = pawndb

# Cap on how many archives surface per rift search (per level).  Most recent
# first.  Excess archives stay on disk but aren't shown.
max_search_results = 100

# pawndb.log handling. One of:
#   disabled - no log file written
#   truncate - log file is reset to empty at each session start
#   append   - new session appends to the existing log (default)
logging = append

# Archive the player's current main pawn on every inn rest.
#   1 - (default) copy remote/0 into <save_dir>/<NNN>/<HEX>.pawn, write .meta/.json
#   0 - skip export; the archive tree is never written to.  Use to read-only
#       browse existing archives without adding new ones.
enable_exports = 1

# Write hired-pawn gear/knowledge back into the source archive at save time.
# Lets changes made to a hired pawn (re-equipping, teaching) persist to the
# archive they were summoned from.
#   1 - (default) on DDDA.sav write, patch each hired pawn's origin archive
#   0 - skip writeback; hired pawns revert to their archived state next summon.
enable_updates = 1
